[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newspaper-layout"
version = "0.1.0"
description = "Template-guided newspaper layout optimizer"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Newspaper Layout Project"}]
dependencies = []

[project.scripts]
newspaper-layout = "newspaper_layout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
